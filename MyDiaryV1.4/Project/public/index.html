<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary</title>
    <link class="diary-icon" rel="icon" type="image/x-icon" href="images/icon.ico">
    <style>

        html, body, button, input, textarea, select, a {
            cursor: url("data:application/octet-stream;base64,AAACAAEAICAAAAAAAAAwAQAAFgAAACgAAAAgAAAAQAAAAAEAAQAAAAAAAAEAAAAAAAAAAAAAAgAAAAIAAAAAAAAA////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAGAAAADAAAAAwAAAAYAAABGAAAAbAAAAHwAAAB/gAAAfwAAAH4AAAB8AAAAeAAAAHAAAABgAAAAQAAAAAAAAAAAAAAA//////////////////////////////////////////////////////////////////////5////8P////D////h///94f///MP///xD///8B////AB///wA///8Af///AP///wH///8D////B////w////8f////P////3////8="), auto !important;
        }
        a, button, .btn-title-square, [role="button"], input[type="submit"], input[type="button"] {
            cursor: url("data:application/octet-stream;base64,AAACAAEAICAAAAoACgAwAQAAFgAAACgAAAAgAAAAQAAAAAEAAQAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////AAAAAAAAAAAAAB/gAAAf4AAAP/AAAD/wAAB/8AAAf/gAAP/4AAC/+AABv/gAA7/4AAM/2AAANtgAADbQAAA2wAAANgAAADAAAAAwAAAAMAAAADAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA///////AD///wA///8AP//+AB///gAf//wAH//8AA//+AAP//gAD//wAA//4AAP/+AAD//iAA///gAf//4AP//+AP///gf///4f///+H////h////4f////P//////////////////////////////////////////////////8="), pointer !important;
        }
        * {
            box-sizing: border-box;
            font-smooth: never;
            -webkit-font-smoothing: none;
        }

        ::-webkit-scrollbar { width: 16px; height: 16px; background: #dfdfdf; }
        ::-webkit-scrollbar-track { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='2' height='2' viewBox='0 0 2 2'><rect width='1' height='1' fill='%23ffffff'/><rect x='1' y='1' width='1' height='1' fill='%23ffffff'/><rect x='1' width='1' height='1' fill='%23808080'/><rect y='1' width='1' height='1' fill='%23808080'/></svg>"); }
        ::-webkit-scrollbar-thumb { background: #c0c0c0; border: 2px solid; border-color: #ffffff #000000 #000000 #ffffff; box-shadow: inset 1px 1px 0px #dfdfdf; }
        ::-webkit-scrollbar-thumb:active { background: #c0c0c0; border: 2px solid; border-color: #808080 #ffffff #ffffff #808080; box-shadow: none; }
        ::-webkit-scrollbar-button { display: none !important; }

        body {
            margin: 0; background-color: #008080;
            font-family: "Pixelated MS Sans Serif", "Courier New", monospace; font-size: 12px; color: #000000;
            display: flex; flex-direction: column; align-items: center; padding: 32px 20px;
        }
        html.ourple {
            background: #6100ff;
        }
        html.ourple::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(97, 0, 255, var(--ourple-color-opacity, 0));
            mix-blend-mode: color;
            pointer-events: none;
            z-index: 2147483647;
        }
        html.ourple::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(97, 0, 255, var(--ourple-cover-opacity, 0));
            pointer-events: none;
            z-index: 2147483647;
        }
        html.kapusta img {
            content: url('images/kapusta.png');
        }
        html.kapusta body {
            background-color: #ffffff;
            background-image: url('images/kapusta.png');
            background-repeat: repeat;
        }
        html.kapusta [style*="background:url"],
        html.kapusta [style*="background: url"],
        html.kapusta .auth-icon,
        html.kapusta #modalIcon {
            background-image: url('images/kapusta.png') !important;
            background-size: contain !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }
        .container { width: 900px; max-width: 100%; display: none; }
        .auth-container { display: none; width: 450px; max-width: 100%; margin-top: 100px; }
        .window { background: #c0c0c0; border: 2px solid; border-color: #ffffff #000000 #000000 #ffffff; padding: 2px; margin-bottom: 32px; }
        .window-content { padding: 10px; }

        .title-bar { background: #000080; display: flex; align-items: center; padding: 4px 6px; margin-bottom: 2px; min-height: 54px; }
        .title-bar.small { min-height: 24px; padding: 2px 4px; margin-bottom: 10px; }
        .title-bar-text { color: #ffffff; font-weight: bold; font-size: 36px; letter-spacing: -1px; line-height: 1; }
        .title-bar.small .title-bar-text { font-size: 12px; letter-spacing: 0; }
        .toolbar { display: flex; align-items: center; gap: 4px; padding: 4px; border-bottom: 1px solid #808080; margin-bottom: 4px; background: #c0c0c0; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-start-gap { display: flex; justify-content: flex-start; gap: 8px; }
        .flex-center { display: flex; align-items: center; }
        .modal-body { padding: 15px; display: flex; gap: 10px; align-items: center; }
        .modal-actions { padding: 10px; text-align: center; display: flex; justify-content: center; gap: 10px; }
        .auth-icon { width: 48px; height: 48px; background: url('images/logreg.ico') center/contain no-repeat; image-rendering: pixelated; flex-shrink: 0; }

        .btn-tool, .btn-sound {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; background: transparent; border: 1px solid transparent; cursor: pointer; outline: none;
        }
        .btn-tool img { width: 24px; height: 24px; image-rendering: pixelated; }
        .btn-sound img { width: 20px; height: 20px; image-rendering: pixelated; }
        .btn-tool:hover, .btn-sound:hover { border-color: #ffffff #808080 #808080 #ffffff; }
        .btn-tool.active, .btn-tool:active, .btn-sound:active { border-color: #808080 #ffffff #ffffff #808080; padding: 2px 0 0 2px; }
        
        .tooltip-red { background: #ff0000 !important; color: #000000 !important; border: 1px solid #000 !important; }
        .btn-logoff {
            width: 32px; height: 32px; min-width: 32px; min-height: 32px; background: #c0c0c0;
            border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset 1px 1px 0px #dfdfdf;
            padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none;
        }
        .btn-logoff:active { border-color: #000 #fff #fff #000; box-shadow: none; padding: 2px 0 0 2px; }
        .btn-logoff img { width: 24px; height: 24px; image-rendering: pixelated; }
        
        .user-icon { width: 20px; height: 20px; }
        .username-text { color: white; font-size: 1.2rem; font-weight: bold; display: inline-block; padding: 0 20px; }
        .search-container { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
        .search-input {
            width: 180px; height: 24px; background: #fff; border: 1px solid;
            border-color: #808080 #ffffff #ffffff #808080; box-shadow: inset 1px 1px 0px #000000; padding: 0 4px; outline: none; font-family: inherit;
        }

        .dropdown { position: relative; }
        .dropdown-content {
            display: none; position: absolute; top: 34px; left: 0; background: #c0c0c0;
            border: 2px solid; border-color: #fff #000 #000 #fff; z-index: 200; min-width: 120px; box-shadow: 2px 2px 0 #000;
        }
        .dropdown.show .dropdown-content { display: block; }
        .dropdown-item { padding: 4px 8px; cursor: pointer; color: #000; }
        .dropdown-item:hover { background: #000080; color: #fff; }

        .form {
            display: grid; gap: 12px; padding: 16px 16px 6px 16px; background: #c0c0c0;
            border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff; box-shadow: 1px 1px 0px 0px #000000;
        }
        .field-row { display: flex; align-items: center; margin-bottom: 8px; }
        .field-row label { width: 80px; margin-right: 10px; }
        .field-row input {
            flex-grow: 1; height: 24px; background: #ffffff; border: 1px solid;
            border-color: #808080 #ffffff #ffffff #808080; box-shadow: inset 1px 1px 0px #000000; padding: 0 4px; outline: none; font-family: inherit;
        }

        textarea, .tag-input {
            width: 100%; padding: 4px 6px; font: inherit; background: #ffffff; border: 1px solid;
            border-color: #808080 #ffffff #ffffff #808080; box-shadow: inset 1px 1px 0px #000000; outline: none;
        }
        textarea { min-height: 120px; resize: vertical; }

        .btn-action-large {
            display: inline-flex; flex-direction: column; align-items: center; padding: 4px 8px;
            background: transparent; border: 1px solid transparent; cursor: pointer; min-width: 80px; font-family: inherit; font-size: 11px;
        }
        .btn-action-large:hover { border-color: #fff #808080 #808080 #fff; }
        .btn-action-large:active { border-color: #808080 #fff #fff #808080; padding: 5px 7px 3px 9px; }

        .button-std {
            min-height: 25px; padding: 0 10px; background: #c0c0c0; border: 2px solid;
            border-color: #fff #808080 #808080 #fff; box-shadow: 1px 1px 0 #000; font: inherit; cursor: pointer;
        }
        .button-std:hover { border-color: #fff #000 #000 #fff; }
        .button-std:active { border-color: #000 #fff #fff #000; }

        .entries { display: grid; gap: 12px; margin-top: 16px; }
        .entry { padding: 16px 16px 6px 16px; background: #ffffff; border: 2px solid; border-color: #808080 #ffffff #ffffff #808080; box-shadow: inset 1px 1px 0px #000000; }
        .meta { color: #000000; font-size: 12px; }
        .meta-id { font-weight: bold; }
        .tag-label { padding: 2px 5px; color: #000000; background: #ffffda; border: 1px solid #808080; font-size: 11px; }
        .content { margin: 14px 0; white-space: pre-wrap; color: #000000; font-size: 12px; }

        #editorWindow { display: none; }
        #customModal { display: fixed; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9999; display: none; align-items: center; justify-content: center; }
        #modalIcon { width: 32px; height: 32px; background: url('images/empty_error.ico') center/contain no-repeat; }
        #tooltip { position: fixed; background: #ffffda; border: 1px solid #000; padding: 2px 5px; font-size: 11px; z-index: 10000; pointer-events: none; display: none; }
        .auth-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: start; }
        .auth-buttons-col { display: flex; flex-direction: column; gap: 6px; }
    </style>
</head>
<body>
    <div id="tooltip"></div>
    <div id="customModal">
        <div class="window" style="width:300px;">
            <div class="title-bar small" id="modalTitleBar">
                <div class="title-bar-text" id="modalTitle">System Message</div>
            </div>
            <div class="window-content modal-body">
                <div id="modalIcon"></div>
                <span id="modalMessage">Message content here.</span>
            </div>
            <div class="modal-actions">
                <button class="button-std" onclick="closeModal()" style="width:60px;" id="modalOkBtn">OK</button>
                <button class="button-std" onclick="closeModal()" style="width:60px; display:none;" id="modalCancelBtn">Cancel</button>
            </div>
        </div>
    </div>
    <div id="authWindow" class="auth-container">
        <div class="window">
            <div class="title-bar small">
                <div class="title-bar-text">Log in or register</div>
            </div>
            <div class="window-content" style="padding:12px;">
                <div class="auth-grid">
                    <div class="auth-icon"></div>
                    <div style="flex-grow:1;">
                        <p style="margin:0 0 12px 0;">Type a user name and password to log in or register your own diary.</p>
                        <div class="field-row">
                            <label for="authUsername">User name:</label>
                            <input type="text" id="authUsername" autocomplete="off">
                        </div>
                        <div class="field-row">
                            <label for="authPassword">Password:</label>
                            <input type="password" id="authPassword">
                        </div>
                    </div>
                    <div class="auth-buttons-col">
                        <button class="button-std" onclick="handleAuthAction('login')" style="min-width:75px;">Login</button>
                        <button class="button-std" onclick="handleAuthAction('register')" style="min-width:75px;">Register</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <main id="diaryMain" class="container">
        <div id="creatorWindow" class="window">
            <div class="title-bar">
                <div class="flex-center" style="flex-grow:1;">
                    <div style="width:32px; height:32px; margin-right:8px; background:url('images/icon.ico') center/contain no-repeat; image-rendering:pixelated;"></div>
                    <div class="title-bar-text">My Diary</div>
                </div>
                <img src="images/reg.ico" alt="User Icon" class="user-icon">
                <span id="displayUsername" class="username-text"></span>
                <button class="btn-logoff" data-tooltip="Log Out" onclick="handleLogout()">
                    <img src="images/logoff.ico" alt="Log Off">
                </button>
            </div>
            <div class="window-content">
                <section class="form">
                    <textarea id="contentInput" placeholder="What is on your mind?"></textarea>
                    <input id="tagInput" class="tag-input" type="text" placeholder="Tag">
                    <div class="flex-between">
                        <div class="flex-start-gap">
                            <button type="button" class="btn-action-large" onclick="addEntry()">
                                <div style="width:32px; height:32px; background:url('images/add_b.ico') center/contain no-repeat;"></div>
                                <span>Add entry</span>
                            </button>
                            <button type="button" id="ourpleButton" class="btn-action-large" onclick="addOurple()">
                                <div style="width:32px; height:32px; background:url('images/ourple.png') center/contain no-repeat;"></div>
                                <span>Ourple</span>
                            </button>
                        </div>
                        <button class="btn-sound btn-locust-tooltip" data-tooltip="Please do not press it is hungry" onclick="Locust()">
                            <img src="images/donot.png" alt="DoNot">
                        </button>
                    </div>
                </section>
            </div>
        </div>
        <div id="editorWindow" class="window">
            <div class="title-bar"><div class="title-bar-text">Editor</div></div>
            <div class="window-content">
                <section class="form">
                    <textarea id="editContentInput"></textarea>
                    <input id="editTagInput" class="tag-input" type="text">
                    <div class="flex-start-gap">
                        <button type="button" class="btn-action-large" onclick="saveEdit()">
                            <div style="width:32px; height:32px; background:url('images/save_b.ico') center/contain no-repeat;"></div>
                            <span>Save Entry</span>
                        </button>
                        <button type="button" class="btn-action-large" onclick="cancelEdit()">
                            <div style="width:32px; height:32px; background:url('images/cancel_b.ico') center/contain no-repeat;"></div>
                            <span>Cancel</span>
                        </button>
                    </div>
                </section>
            </div>
        </div>
        <div class="window">
            <div class="title-bar"><div class="title-bar-text">Entries</div></div>
            <div class="toolbar">
                <button class="btn-tool" data-tooltip="Export As .txt File" onclick="triggerExport()"><img src="images/export_b.ico" alt="Export"></button>
                <button class="btn-tool" data-tooltip="Open Trash json" onclick="openTrash()"><img src="images/trash_b.ico" alt="Trash"></button>
                <div class="dropdown" id="searchDropdown">
                    <button class="btn-tool" data-tooltip="Search Entries" onclick="toggleDropdown(event)"><img src="images/search_b.ico" alt="Search"></button>
                    <div class="dropdown-content">
                        <div class="dropdown-item" onclick="setSearchMode('tag')">Search by tag</div>
                        <div class="dropdown-item" onclick="setSearchMode('date')">Search by date</div>
                    </div>
                </div>
                <div class="search-container"><input type="text" id="searchInput" class="search-input" maxlength="25" placeholder="Search by tag..." oninput="handleSearch(this.value)"></div>
            </div>
            <div class="window-content"><section id="entryList" class="entries"></section></div>
        </div>
    </main>
    <script>
        let currentSearchMode = 'tag', allEntries = [], editingEntryId = null, IsLocustOut = false, locustInterval = null;
        function playSound(f) { new Audio(`sounds/${f}`).play(); }
        function showModal(title, msg, iconUrl, onOk, showCancel = false, playSnd = true, useTada = false) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = msg;
            document.getElementById('modalIcon').style.backgroundImage = `url('${iconUrl}')`;
            document.getElementById('modalOkBtn').onclick = () => { closeModal(); if(onOk) onOk(); };
            document.getElementById('modalCancelBtn').style.display = showCancel ? 'block' : 'none';
            document.getElementById('customModal').style.display = 'flex';
            if (playSnd) playSound(useTada ? 'tada.mp3' : 'chord.mp3');
        }
        function closeModal() { document.getElementById('customModal').style.display = 'none'; }
        function toggleDropdown(e) { e.stopPropagation(); document.getElementById('searchDropdown').classList.toggle('show'); }
        window.onclick = () => document.getElementById('searchDropdown').classList.remove('show');
        const tooltip = document.getElementById('tooltip');
        document.addEventListener('mouseover', (e) => {
            const target = e.target.closest('[data-tooltip]');
            if (target) {
                tooltip.textContent = target.getAttribute('data-tooltip');
                tooltip.style.display = 'block';
                tooltip.className = target.classList.contains('btn-locust-tooltip') ? 'tooltip-red' : '';
            }
        });
        document.addEventListener('mousemove', (e) => {
            if (tooltip.style.display === 'block') {
                tooltip.style.left = (e.clientX + 10) + 'px';
                tooltip.style.top = (e.clientY + 10) + 'px';
            }
        });
        document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tooltip]')) tooltip.style.display = 'none'; });
        function Locust() {
            const originalContent = document.body.innerHTML, originalBg = document.body.style.backgroundColor;
            document.body.style.backgroundColor = 'black'; document.body.style.margin = '0'; document.body.style.padding = '0';
            document.body.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; background-color: black;">
                    <video id="locustVideo" src="images/thelocust/locust.mp4" autoplay style="height: 100vh; width: auto; object-fit: contain;"></video>
                </div>
            `;
            document.getElementById('locustVideo').onended = () => {
                document.body.innerHTML = originalContent; document.body.style.backgroundColor = originalBg;
                IsLocustOut = true; checkSession(); startLocusting();
            };
        }
        function startLocusting() {
            if (locustInterval) clearInterval(locustInterval);
            locustInterval = setInterval(() => {
                const vid = document.createElement('video');
                vid.src = Math.random() > 0.5 ? 'images/thelocust/theheart.mp4' : 'images/thelocust/tweaking.mp4';
                vid.autoplay = true; vid.style.position = 'fixed'; vid.style.width = '500px'; vid.style.zIndex = '99999';
                vid.style.top = Math.random() * (window.innerHeight - 150) + 'px';
                vid.style.left = Math.random() * (window.innerWidth - 150) + 'px';
                document.body.appendChild(vid);
                setTimeout(() => vid.remove(), 5000);
            }, Math.random() * 300 + 50);
        }
        function getAuthHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('diary_token')}` }; }
        function checkSession() { localStorage.getItem('diary_token') ? showApp() : showAuth(); }
        function isSleepDeprived(username) {
            return username.trim().toLowerCase() === 'sleep deprived';
        }
        function isMorton(username) {
            return username.trim().toLowerCase() === 'morton';
        }
        function setKapusta(username) {
            document.documentElement.classList.toggle('kapusta', isMorton(username));
        }
        function setOurple(amount = 0) {
            const ourpleAmount = Math.min(amount, 2);
            const colorOpacity = Math.min(ourpleAmount, 1);
            const coverOpacity = Math.max(0, ourpleAmount - 1);
            document.documentElement.classList.toggle('ourple', ourpleAmount > 0);
            document.documentElement.style.setProperty('--ourple-color-opacity', colorOpacity);
            document.documentElement.style.setProperty('--ourple-cover-opacity', coverOpacity);
            localStorage.setItem('ourpleAmount', String(ourpleAmount));
        }
        function addOurple() {
            setOurple(Number(localStorage.getItem('ourpleAmount') || 0) + 0.15);
        }
        function showAuth() {
            setOurple(0);
            setKapusta('');
            document.getElementById('diaryMain').style.display = 'none';
            document.getElementById('authWindow').style.display = 'block';
        }
        function showApp() {
            const username = localStorage.getItem('currentUsername') || 'User';
            setKapusta(username);
            const ourpleButton = document.getElementById('ourpleButton');
            const canOurple = isSleepDeprived(username);
            ourpleButton.style.display = canOurple ? 'inline-flex' : 'none';
            setOurple(canOurple ? Number(localStorage.getItem('ourpleAmount') || 0) : 0);
            document.getElementById('authWindow').style.display = 'none';
            document.getElementById('diaryMain').style.display = 'block';
            fetchEntries();
            document.getElementById('displayUsername').textContent = username;
        }
        async function handleAuthAction(type) {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            if (!username || !password) return showModal('Log in error', 'You must provide both a user name and password.', 'images/empty_error.ico');
            try {
                const res = await fetch(`/api/auth/${type}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const data = await res.json();
                if (!res.ok) return showModal('Log in error', data.message || data.error || 'Authentication failed.', 'images/empty_error.ico');

                if (type === 'login') {
                    localStorage.setItem('diary_token', data.token); localStorage.setItem('currentUsername', username);
                    playSound(username.toLowerCase() === 'laplesz' ? 'startold.mp3' : 'start.mp3');
                    ['authUsername', 'authPassword'].forEach(id => document.getElementById(id).value = '');
                    showApp();
                } else {
                    showModal('New user added', 'Registration successful! You can now log in to your diary account.', 'images/reg.ico', null, false, true, true);
                }
            } catch (err) {
                showModal('Log in error', 'Could not establish connection to authentication server.', 'images/empty_error.ico');
            }
        }
        function handleLogout() {
            playSound('tada.mp3');
            localStorage.removeItem('diary_token');
            localStorage.removeItem('currentUsername');
            showAuth();
        }
        function setSearchMode(mode) { currentSearchMode = mode; document.getElementById('searchInput').placeholder = mode === 'tag' ? 'Search by tag...' : 'MM-DD-YYYY'; handleSearch(document.getElementById('searchInput').value); }
        async function fetchEntries() {
            try {
                const res = await fetch('/api/entries', { headers: getAuthHeaders() });
                if (res.status === 401 || res.status === 403) return handleLogout();
                const data = await res.json();
                allEntries = (data && !data.error && Array.isArray(data)) ? data : [];
                handleSearch(document.getElementById('searchInput').value);
            } catch (err) {
                allEntries = []; renderEntries([]);
            }
        }
        function getCleanDates(dateObject) {
            const d = new Date(dateObject), day = String(d.getDate()).padStart(2, '0'), month = String(d.getMonth() + 1).padStart(2, '0'), year = d.getFullYear();
            return [`${day}-${month}-${year}`, `${day}/${month}/${year}`];
        }
        function renderEntries(entries) {
            const list = document.getElementById('entryList');
            list.innerHTML = '';
            if (!entries || entries.length === 0) {
                list.innerHTML = `<p class="meta">${document.getElementById('searchInput').value.trim() ? "No matching entries found." : "No entries yet."}</p>`;
                return;
            }
            entries.forEach(e => {
                const d = new Date(e.createdAt), u = new Date(e.updatedAt);
                const dateStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
                const redactLabel = e.isRedacted == 1 ? `<span class="tag-label" style="background:#dfdfdf; border:1px solid #808080; margin-left: 5px;">Redacted ${String(u.getHours()).padStart(2, '0')}:${String(u.getMinutes()).padStart(2, '0')}</span>` : '';
                const card = document.createElement('article');
                card.className = 'entry';
                card.innerHTML = `
                    <div class="flex-between"><div><span class="meta">${dateStr} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</span>${redactLabel}</div>${e.tag ? `<span class="tag-label">${e.tag}</span>` : ''}</div>
                    <div class="content">${e.content}</div>
                    <div class="flex-between"><span class="meta meta-id">ID: ${e.id}</span><div style="display:flex; gap:4px;"><button class="btn-tool" data-tooltip="Edit Entry" onclick="openEditor(${e.id})"><img src="images/redact_b.ico"></button><button class="btn-tool" data-tooltip="Delete Entry" onclick="confirmDelete(${e.id})"><img src="images/delete_b.ico"></button></div></div>`;
                list.appendChild(card);
            });
        }
        function handleSearch(val) {
            const q = val.trim().toLowerCase();
            if (!q) return renderEntries(allEntries);
            renderEntries(allEntries.filter(e => currentSearchMode === 'tag' ? (e.tag || '').toLowerCase().includes(q) : getCleanDates(e.createdAt).some(d => d.startsWith(q))));
        }
        async function addEntry() {
            const username = localStorage.getItem('currentUsername') || '';
            const content = isMorton(username) ? 'капуста' : document.getElementById('contentInput').value;
            const tag = document.getElementById('tagInput').value;
            if (!content.trim()) return showModal('Entry Error', 'You can not create an empty entry.', 'images/empty_error.ico');
            try {
                const res = await fetch('/api/entries', { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({ content, tag }) });
                if (res.status === 401) return handleLogout();
                playSound('chimes.mp3'); ['contentInput', 'tagInput'].forEach(id => document.getElementById(id).value = '');
                fetchEntries();
            } catch(err) { showModal('Server Error', 'Could not save entry.', 'images/empty_error.ico'); }
        }
        function openEditor(id) {
            editingEntryId = id; const e = allEntries.find(x => x.id === id);
            document.getElementById('editContentInput').value = e.content; document.getElementById('editTagInput').value = e.tag || '';
            document.getElementById('creatorWindow').style.display = 'none'; document.getElementById('editorWindow').style.display = 'block';
        }
        async function saveEdit() {
            try {
                const res = await fetch(`/api/entries/${editingEntryId}`, { method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify({ content: document.getElementById('editContentInput').value, tag: document.getElementById('editTagInput').value }) });
                if (res.status === 401) return handleLogout();
                playSound('ding.mp3'); closeEditor(); fetchEntries();
            } catch(err) { showModal('Server Error', 'Could not update entry.', 'images/empty_error.ico'); }
        }
        function cancelEdit() { closeEditor(); }
        function closeEditor() { editingEntryId = null; document.getElementById('editorWindow').style.display = 'none'; document.getElementById('creatorWindow').style.display = 'block'; }
        function confirmDelete(id) { showModal('Confirm Entry Delete', 'Are you sure you want to delete this entry?', 'images/recycle.ico', () => deleteEntry(id), true, false); }
        async function deleteEntry(id) {
            if (editingEntryId === id) closeEditor();
            try {
                const res = await fetch(`/api/entries/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
                if (res.status === 401) return handleLogout();
                playSound('emptybin.mp3'); fetchEntries();
            } catch(err) { showModal('Server Error', 'Could not delete entry.', 'images/empty_error.ico'); }
        }
        async function triggerExport() {
            try {
                const response = await fetch('/api/entries/export', { method: 'GET', headers: getAuthHeaders() });
                if (response.status === 400) return showModal('Export Error', (await response.json()).error || 'Your diary is empty, no entries to be exported.', 'images/empty_error.ico');
                if (!response.ok) return showModal('Export Error', 'Export failed. Please log in again.', 'images/empty_error.ico');
                
                const blob = await response.blob(), url = window.URL.createObjectURL(blob), a = document.createElement('a');
                a.href = url; a.download = 'my_diary.txt'; document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url); a.remove();
            } catch (error) { showModal('Export Error', 'An unexpected error occurred during export.', 'images/empty_error.ico'); }
        }
        async function openTrash() {
            try {
                const res = await fetch('/api/trash', { headers: getAuthHeaders() });
                if (res.status === 401 || res.status === 403) return handleLogout();
                if (!res.ok) return showModal('Trash Error', 'Could not access trash.', 'images/empty_error.ico');
                window.open("", "_blank").document.write(`<pre>${JSON.stringify(await res.json(), null, 2)}</pre>`);
            } catch (err) { showModal('Trash Error', 'An unexpected error occurred.', 'images/empty_error.ico'); }
        }
        checkSession();
    </script>
</body>
</html>
