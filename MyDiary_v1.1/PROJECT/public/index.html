<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diary</title>
    <link
      class="diary-icon"
      rel="icon"
      type="image/x-icon"
      href="images/icon.ico"
    />
    <style>
      * {
        box-sizing: border-box;
        font-smooth: never;
        -webkit-font-smoothing: none;
      }

      ::-webkit-scrollbar {
        width: 16px;
        height: 16px;
        background: #dfdfdf;
      }

      ::-webkit-scrollbar-track {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='2' height='2' viewBox='0 0 2 2'><rect width='1' height='1' fill='%23ffffff'/><rect x='1' y='1' width='1' height='1' fill='%23ffffff'/><rect x='1' width='1' height='1' fill='%23808080'/><rect y='1' width='1' height='1' fill='%23808080'/></svg>");
      }

      ::-webkit-scrollbar-thumb {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #ffffff #000000 #000000 #ffffff;
        box-shadow: inset 1px 1px 0px #dfdfdf;
      }

      ::-webkit-scrollbar-thumb:active {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #808080 #ffffff #ffffff #808080;
        box-shadow: none;
      }

      ::-webkit-scrollbar-button {
        display: none !important;
      }

      body {
        margin: 0;
        background-color: #008080;
        font-family: "Pixelated MS Sans Serif", "Courier New", monospace;
        font-size: 12px;
        color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 20px;
      }

      .container {
        width: 900px;
        max-width: 100%;
      }

      .window {
        background: #c0c0c0;
        border: 2px solid;
        border-color: #ffffff #000000 #000000 #ffffff;
        padding: 2px;
        margin-bottom: 32px;
      }

      .title-bar {
        background: #000080;
        display: flex;
        align-items: center;
        padding: 4px 6px;
        margin-bottom: 2px;
        min-height: 54px;
      }

      .title-bar-text {
        color: #ffffff;
        font-weight: bold;
        font-size: 36px;
        letter-spacing: -1px;
        line-height: 1;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-bottom: 1px solid #808080;
        margin-bottom: 4px;
        background: #c0c0c0;
      }

      .btn-tool {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        outline: none;
      }

      .btn-tool img {
        width: 24px;
        height: 24px;
        image-rendering: pixelated;
      }

      .btn-tool:hover {
        border-top: 1px solid #ffffff;
        border-left: 1px solid #ffffff;
        border-right: 1px solid #808080;
        border-bottom: 1px solid #808080;
      }

      .btn-tool.active,
      .btn-tool:active {
        border-top: 1px solid #808080;
        border-left: 1px solid #808080;
        border-right: 1px solid #ffffff;
        border-bottom: 1px solid #ffffff;
        padding: 2px 0 0 2px;
      }

      .btn-sound {
        width: 20px;
        height: 20px;
        border: none;
        background: url("images/sound.ico") center/contain no-repeat;
        cursor: pointer;
        margin-left: auto;
      }

      .search-container {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: 8px;
      }

      .search-input {
        width: 180px;
        height: 24px;
        background: #fff;
        border: 1px solid;
        border-top-color: #808080;
        border-left-color: #808080;
        border-right-color: #ffffff;
        border-bottom-color: #ffffff;
        box-shadow: inset 1px 1px 0px #000000;
        padding: 0 4px;
        outline: none;
        font-family: inherit;
      }

      .dropdown {
        position: relative;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        top: 34px;
        left: 0;
        background: #c0c0c0;
        border: 2px solid;
        border-color: #fff #000 #000 #fff;
        z-index: 200;
        min-width: 120px;
        box-shadow: 2px 2px 0 #000;
      }

      .dropdown.show .dropdown-content {
        display: block;
      }

      .dropdown-item {
        padding: 4px 8px;
        cursor: pointer;
        color: #000;
      }

      .dropdown-item:hover {
        background: #000080;
        color: #fff;
      }

      .window-content {
        padding: 10px;
      }

      .form {
        display: grid;
        gap: 12px;
        padding: 16px 16px 6px 16px;
        background: #c0c0c0;
        border: 2px solid;
        border-top-color: #ffffff;
        border-left-color: #ffffff;
        border-right-color: #808080;
        border-bottom-color: #808080;
        box-shadow: 1px 1px 0px 0px #000000;
      }

      textarea,
      .tag-input {
        width: 100%;
        padding: 4px 6px;
        font: inherit;
        background: #ffffff;
        border: 1px solid;
        border-top-color: #808080;
        border-left-color: #808080;
        border-right-color: #ffffff;
        border-bottom-color: #ffffff;
        box-shadow: inset 1px 1px 0px #000000;
        outline: none;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .btn-action-large {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        padding: 4px 8px;
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        min-width: 80px;
        font-family: inherit;
        font-size: 11px;
      }

      .btn-action-large:hover {
        border-top: 1px solid #fff;
        border-left: 1px solid #fff;
        border-right: 1px solid #808080;
        border-bottom: 1px solid #808080;
      }

      .btn-action-large:active {
        border-top: 1px solid #808080;
        border-left: 1px solid #808080;
        border-right: 1px solid #fff;
        border-bottom: 1px solid #fff;
        padding: 5px 7px 3px 9px;
      }

      .button-std {
        min-height: 25px;
        padding: 0 10px;
        background: #c0c0c0;
        border: 2px solid;
        border-top-color: #fff;
        border-left-color: #fff;
        border-right-color: #808080;
        border-bottom-color: #808080;
        box-shadow: 1px 1px 0 #000;
        font: inherit;
        cursor: pointer;
      }

      .button-std:hover {
        border-top-color: #fff;
        border-left-color: #fff;
        border-right-color: #000;
        border-bottom-color: #000;
      }

      .button-std:active {
        border-top-color: #000;
        border-left-color: #000;
        border-right-color: #fff;
        border-bottom-color: #fff;
      }

      .entries {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .entry {
        padding: 16px 16px 6px 16px;
        background: #ffffff;
        border: 2px solid;
        border-top-color: #808080;
        border-left-color: #808080;
        border-right-color: #ffffff;
        border-bottom-color: #ffffff;
        box-shadow: inset 1px 1px 0px #000000;
      }

      .meta {
        color: #000000;
        font-size: 12px;
      }

      .meta-id {
        font-weight: bold;
      }

      .tag-label {
        padding: 2px 5px;
        color: #000000;
        background: #ffffda;
        border: 1px solid #808080;
        font-size: 11px;
      }

      .content {
        margin: 14px 0;
        white-space: pre-wrap;
        color: #000000;
        font-size: 12px;
      }

      #editorWindow {
        display: none;
      }

      #customModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        z-index: 9999;
        align-items: center;
        justify-content: center;
      }

      #tooltip {
        position: fixed;
        background: #ffffda;
        border: 1px solid #000;
        padding: 2px 5px;
        font-size: 11px;
        z-index: 10000;
        pointer-events: none;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tooltip"></div>

    <div id="customModal">
      <div class="window" style="width: 300px">
        <div
          class="title-bar"
          style="min-height: 24px; padding: 2px 4px; margin-bottom: 10px"
        >
          <div class="title-bar-text" style="font-size: 12px" id="modalTitle">
            Entry Error
          </div>
        </div>
        <div
          class="window-content"
          style="padding: 15px; display: flex; gap: 10px; align-items: center"
        >
          <div
            id="modalIcon"
            style="
              width: 32px;
              height: 32px;
              background: url(&quot;images/empty_error.ico&quot;) center/contain
                no-repeat;
            "
          ></div>
          <span id="modalMessage">You can not create an empty entry.</span>
        </div>
        <div
          style="
            padding: 10px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 10px;
          "
        >
          <button
            class="button-std"
            onclick="closeModal()"
            style="width: 60px"
            id="modalOkBtn"
          >
            OK
          </button>
          <button
            class="button-std"
            onclick="closeModal()"
            style="width: 60px; display: none"
            id="modalCancelBtn"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <main class="container">
      <div id="creatorWindow" class="window">
        <div class="title-bar">
          <div style="display: flex; align-items: center; flex-grow: 1">
            <div
              style="
                width: 32px;
                height: 32px;
                margin-right: 8px;
                background: url(&quot;images/icon.ico&quot;) center/contain
                  no-repeat;
                image-rendering: pixelated;
              "
            ></div>
            <div class="title-bar-text">My Diary</div>
          </div>
          <button class="btn-sound" onclick="playSound('start.mp3')"></button>
        </div>
        <div class="window-content">
          <section class="form">
            <textarea
              id="contentInput"
              placeholder="What is on your mind?"
            ></textarea>
            <input
              id="tagInput"
              class="tag-input"
              type="text"
              placeholder="Tag"
            />
            <div style="display: flex; justify-content: flex-start">
              <button
                type="button"
                class="btn-action-large"
                onclick="addEntry()"
              >
                <div
                  style="
                    width: 32px;
                    height: 32px;
                    background: url(&quot;images/add_b.ico&quot;) center/contain
                      no-repeat;
                  "
                ></div>
                <span>Add entry</span>
              </button>
            </div>
          </section>
        </div>
      </div>

      <div id="editorWindow" class="window">
        <div class="title-bar"><div class="title-bar-text">Editor</div></div>
        <div class="window-content">
          <section class="form">
            <textarea id="editContentInput"></textarea>
            <input id="editTagInput" class="tag-input" type="text" />
            <div style="display: flex; justify-content: flex-start; gap: 8px">
              <button
                type="button"
                class="btn-action-large"
                onclick="saveEdit()"
              >
                <div
                  style="
                    width: 32px;
                    height: 32px;
                    background: url(&quot;images/save_b.ico&quot;)
                      center/contain no-repeat;
                  "
                ></div>
                <span>Save Entry</span>
              </button>
              <button
                type="button"
                class="btn-action-large"
                onclick="cancelEdit()"
              >
                <div
                  style="
                    width: 32px;
                    height: 32px;
                    background: url(&quot;images/cancel_b.ico&quot;)
                      center/contain no-repeat;
                  "
                ></div>
                <span>Cancel</span>
              </button>
            </div>
          </section>
        </div>
      </div>

      <div class="window">
        <div class="title-bar"><div class="title-bar-text">Entries</div></div>
        <div class="toolbar">
          <button
            class="btn-tool"
            data-tooltip="Export As .txt File"
            onclick="location.href = '/api/entries/export'"
          >
            <img src="images/export_b.ico" alt="Export" />
          </button>
          <button
            class="btn-tool"
            data-tooltip="Open Trash json"
            onclick="location.href = '/api/trash'"
          >
            <img src="images/trash_b.ico" alt="Trash" />
          </button>
          <div class="dropdown" id="searchDropdown">
            <button
              class="btn-tool"
              data-tooltip="Search Entries"
              onclick="toggleDropdown(event)"
            >
              <img src="images/search_b.ico" alt="Search" />
            </button>
            <div class="dropdown-content">
              <div class="dropdown-item" onclick="setSearchMode('tag')">
                Search by tag
              </div>
              <div class="dropdown-item" onclick="setSearchMode('date')">
                Search by date
              </div>
            </div>
          </div>
          <div class="search-container">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              maxlength="25"
              placeholder="Search by tag..."
              oninput="handleSearch(this.value)"
            />
          </div>
        </div>
        <div class="window-content">
          <section id="entryList" class="entries"></section>
        </div>
      </div>
    </main>

    <script>
      let currentSearchMode = "tag";
      let allEntries = [];
      let editingEntryId = null;

      function playSound(f) {
        new Audio(`sounds/${f}`).play();
      }

      function showModal(
        title,
        msg,
        iconUrl,
        onOk,
        showCancel = false,
        playSnd = true,
      ) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalMessage").textContent = msg;
        document.getElementById("modalIcon").style.backgroundImage =
          `url('${iconUrl}')`;
        document.getElementById("modalOkBtn").onclick = () => {
          closeModal();
          if (onOk) onOk();
        };
        document.getElementById("modalCancelBtn").style.display = showCancel
          ? "block"
          : "none";
        document.getElementById("customModal").style.display = "flex";
        if (playSnd) {
          playSound("chord.mp3");
        }
      }

      function closeModal() {
        document.getElementById("customModal").style.display = "none";
      }

      function toggleDropdown(e) {
        e.stopPropagation();
        document.getElementById("searchDropdown").classList.toggle("show");
      }

      window.onclick = () => {
        document.getElementById("searchDropdown").classList.remove("show");
      };

      // Tooltip logic
      const tooltip = document.getElementById("tooltip");
      document.addEventListener("mouseover", (e) => {
        const target = e.target.closest("[data-tooltip]");
        if (target) {
          tooltip.textContent = target.getAttribute("data-tooltip");
          tooltip.style.display = "block";
        }
      });

      document.addEventListener("mousemove", (e) => {
        if (tooltip.style.display === "block") {
          tooltip.style.left = e.clientX + 10 + "px";
          tooltip.style.top = e.clientY + 10 + "px";
        }
      });

      document.addEventListener("mouseout", (e) => {
        if (e.target.closest("[data-tooltip]")) {
          tooltip.style.display = "none";
        }
      });

      function setSearchMode(mode) {
        currentSearchMode = mode;
        document.getElementById("searchInput").placeholder =
          mode === "tag" ? "Search by tag..." : "MM-DD-YYYY";
        handleSearch(document.getElementById("searchInput").value);
      }

      async function fetchEntries() {
        const res = await fetch("/api/entries");
        allEntries = await res.json();
        handleSearch(document.getElementById("searchInput").value);
      }

      function getCleanDates(dateObject) {
        const d = new Date(dateObject);
        const day = String(d.getDate()).padStart(2, "0");
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const year = String(d.getFullYear());
        return [
          `${month}-${day}-${year}`,
          `${month}/${day}/${year}`,
          `${String(d.getMonth() + 1)}-${day}-${year}`,
          `${String(d.getMonth() + 1)}/${day}-${year}`,
        ];
      }

      function renderEntries(entries) {
        const list = document.getElementById("entryList");
        list.innerHTML = "";
        if (entries.length === 0) {
          list.innerHTML = '<p class="meta">No matching entries found.</p>';
          return;
        }
        entries.forEach((e) => {
          const redacted =
            e.isRedacted && e.updatedAt
              ? ` <span style="color: #808080;">(last redacted: ${new Date(e.updatedAt).toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "numeric" }).replace(/\//g, "-")})</span>`
              : "";
          const card = document.createElement("article");
          card.className = "entry";
          card.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="meta">${new Date(e.createdAt).toLocaleString()}${redacted}</span>
                    ${e.tag ? `<span class="tag-label">${e.tag}</span>` : ""}
                </div>
                <div class="content">${e.content}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="meta meta-id">ID: ${e.id}</span>
                    <div style="display:flex; gap:4px;">
                        <button class="btn-tool" data-tooltip="Edit Entry" onclick="openEditor(${e.id})"><img src="images/redact_b.ico"></button>
                        <button class="btn-tool" data-tooltip="Delete Entry" onclick="confirmDelete(${e.id})"><img src="images/delete_b.ico"></button>
                    </div>
                </div>`;
          list.appendChild(card);
        });
      }

      function handleSearch(val) {
        const q = val.trim().toLowerCase();
        if (!q) return renderEntries(allEntries);
        renderEntries(
          allEntries.filter((e) =>
            currentSearchMode === "tag"
              ? (e.tag || "").toLowerCase().includes(q)
              : getCleanDates(e.createdAt).some((d) => d.startsWith(q)),
          ),
        );
      }

      async function addEntry() {
        const content = document.getElementById("contentInput").value;
        if (!content.trim())
          return showModal(
            "Entry Error",
            "You can not create an empty entry.",
            "images/empty_error.ico",
          );
        await fetch("/api/entries", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content,
            tag: document.getElementById("tagInput").value,
          }),
        });
        playSound("chimes.mp3");
        document.getElementById("contentInput").value = "";
        fetchEntries();
      }

      function openEditor(id) {
        editingEntryId = id;
        const e = allEntries.find((x) => x.id === id);
        document.getElementById("editContentInput").value = e.content;
        document.getElementById("editTagInput").value = e.tag || "";
        document.getElementById("creatorWindow").style.display = "none";
        document.getElementById("editorWindow").style.display = "block";
      }

      async function saveEdit() {
        await fetch(`/api/entries/${editingEntryId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            content: document.getElementById("editContentInput").value,
            tag: document.getElementById("editTagInput").value,
          }),
        });
        playSound("ding.mp3");
        closeEditor();
        fetchEntries();
      }

      function cancelEdit() {
        closeEditor();
      }

      function closeEditor() {
        editingEntryId = null;
        document.getElementById("editorWindow").style.display = "none";
        document.getElementById("creatorWindow").style.display = "block";
      }

      function confirmDelete(id) {
        showModal(
          "Confirm Entry Delete",
          "Are you sure you want to delete this entry?",
          "images/recycle.ico",
          () => deleteEntry(id),
          true,
          false,
        );
      }

      async function deleteEntry(id) {
        if (editingEntryId === id) closeEditor();
        await fetch(`/api/entries/${id}`, { method: "DELETE" });
        playSound("emptybin.mp3");
        fetchEntries();
      }

      fetchEntries();
    </script>
  </body>
</html>
