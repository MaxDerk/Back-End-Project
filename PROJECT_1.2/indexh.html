<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій Щоденник</title>
</head>
<body>

<div class="container">
    <h1>Мій Щоденник ✍️</h1>

    <!-- Форма додавання -->
    <div class="form-group">
        <textarea id="contentInput" placeholder="Що у вас на думці?"></textarea>
        <input type="text" id="tagInput" placeholder="Тег (н-р: робота)">
        <button class="btn-add" onclick="addEntry()">Додати</button>
    </div>

    <div class="controls">
        <h3>Ваші записи</h3>
        <a href="http://localhost:3000/api/entries/export" class="btn-export">Скачати .txt</a>
    </div>

    <!-- Список записів -->
    <div id="entryList" class="entry-list">
        <!-- Тут будуть записи -->
    </div>
</div>

<script>
    const API_URL = 'http://localhost:3000/api/entries';

    // Завантаження записів
    async function fetchEntries() {
        try {
            const response = await fetch(API_URL);
            const entries = await response.json();
            renderEntries(entries);
        } catch (error) {
            console.error('Помилка завантаження:', error);
        }
    }

    // Малювання записів на екрані
    function renderEntries(entries) {
        const list = document.getElementById('entryList');
        list.innerHTML = '';
        
        entries.forEach(entry => {
            const date = new Date(entry.createdAt).toLocaleString('uk-UA');
            const card = document.createElement('div');
            card.className = 'entry-card';
            card.innerHTML = `
                <div class="entry-header">
                    <span>${date}</span>
                    ${entry.tag ? `<span class="entry-tag">${entry.tag}</span>` : ''}
                </div>
                <div class="entry-content">${entry.content}</div>
                <div style="text-align: right; margin-top: 10px;">
                    <button class="btn-delete" onclick="deleteEntry(${entry.id})">Видалити</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    // Додавання запису
    async function addEntry() {
        const content = document.getElementById('contentInput').value;
        const tag = document.getElementById('tagInput').value;

        if (!content.trim()) return alert('Напишіть щось!');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content, tag })
            });

            if (response.ok) {
                document.getElementById('contentInput').value = '';
                document.getElementById('tagInput').value = '';
                fetchEntries();
            }
        } catch (error) {
            alert('Помилка при збереженні');
        }
    }

    // Видалення запису
    async function deleteEntry(id) {
        if (!confirm("Видалити цей запис? (Він з'явиться у кошику)")) return;

        try {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchEntries();
        } catch (error) {
            alert('Помилка при видаленні');
        }
    }

    // Початкове завантаження
    fetchEntries();
</script>

</body>
</html>
